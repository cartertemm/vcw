<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Halloween Score Tracker</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0f1117;
			--surface: #1a1d27;
			--surface-raised: #232735;
			--line: #2e3344;
			--fg: #f4f5f8;
			--muted: #9aa1b5;
			--accent: #ffd93d;
			--danger: #ff6b6b;
			--radius: 1.25rem;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: radial-gradient(circle at 50% -20%, #232845 0%, var(--bg) 60%) fixed;
			color: var(--fg);
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			max-width: 72rem;
			margin: 0 auto;
			padding: 1.25rem 1.5rem;
		}

		header h1 {
			margin: 0;
			font-size: 1.5rem;
			font-weight: 800;
			letter-spacing: -0.02em;
			white-space: nowrap;
		}

		header .button {
			white-space: nowrap;
		}

		main {
			max-width: 72rem;
			margin: 0 auto;
			padding: 0 1.5rem 3rem;
		}

		h2 {
			margin: 1rem 0 1.5rem;
			font-size: 1.75rem;
			font-weight: 800;
		}

		h2:focus {
			outline: none;
		}

		button, input, select {
			font: inherit;
			color: var(--fg);
		}

		button {
			cursor: pointer;
			border: none;
			transition: transform 0.08s ease, background-color 0.15s ease, filter 0.15s ease;
		}

		button:active {
			transform: scale(0.94);
		}

		:focus-visible {
			outline: 3px solid var(--fg);
			outline-offset: 3px;
		}

		.button {
			padding: 0.75rem 1.5rem;
			border-radius: 999px;
			font-weight: 700;
			background: var(--surface-raised);
			border: 1px solid var(--line);
		}

		.button:hover {
			background: var(--line);
		}

		.button-primary {
			background: var(--accent);
			border-color: var(--accent);
			color: #1a1400;
		}

		.button-primary:hover {
			background: var(--accent);
			filter: brightness(1.08);
		}

		ul {
			list-style: none;
			padding: 0;
			margin: 0 0 2rem;
		}

		.scoreboard {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
			gap: 1.25rem;
		}

		.score-card {
			display: grid;
			grid-template-columns: auto 1fr auto;
			grid-template-areas: "name name name" "minus score plus";
			align-items: center;
			gap: 0.5rem 1rem;
			padding: 1.25rem 1.25rem 1.5rem;
			border-radius: var(--radius);
			background: linear-gradient(160deg, color-mix(in srgb, var(--team) 22%, var(--surface)) 0%, var(--surface) 70%);
			border: 1px solid color-mix(in srgb, var(--team) 40%, var(--line));
			border-top: 6px solid var(--team);
			box-shadow: 0 10px 30px rgb(0 0 0 / 0.35);
		}

		.score-card .team-name {
			grid-area: name;
			text-align: center;
			font-size: clamp(1.25rem, 3vw, 1.75rem);
			font-weight: 800;
			color: var(--team);
			overflow-wrap: anywhere;
		}

		.score {
			grid-area: score;
			text-align: center;
			font-size: clamp(4rem, 12vw, 6.5rem);
			font-weight: 900;
			line-height: 1.05;
			font-variant-numeric: tabular-nums;
		}

		.score.bump {
			animation: bump 0.25s ease;
		}

		@keyframes bump {
			50% { transform: scale(1.15); }
		}

		.score-card.dead {
			--team: #9a9fab;
			grid-template-areas: "rip rip rip" "name name name" "minus score plus";
			padding-top: 1.75rem;
			border-radius: 9rem 9rem 0.75rem 0.75rem / 4rem 4rem 0.75rem 0.75rem;
			background: linear-gradient(180deg, #6b707c 0%, #3d4049 100%);
			border: 1px solid #7a7f8b;
			border-bottom: 10px solid #4a3626;
		}

		.score-card.dead::before {
			content: "RIP";
			grid-area: rip;
			text-align: center;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 1.75rem;
			font-weight: 700;
			letter-spacing: 0.3em;
			color: #1f2228;
			text-shadow: 0 1px 0 rgb(255 255 255 / 0.3);
		}

		.score-card.dead .team-name {
			color: #f0f1f4;
		}

		.score-card.dead .plus {
			background: var(--team-live);
			box-shadow: 0 4px 16px color-mix(in srgb, var(--team-live) 45%, transparent);
		}

		.score-card.rising {
			animation: rise 0.7s ease-out;
		}

		@keyframes rise {
			0% { transform: translateY(70%) rotate(-4deg); clip-path: inset(0 0 70% 0); }
			45% { transform: translateY(25%) rotate(3deg); clip-path: inset(0 0 25% 0); }
			75% { transform: translateY(-6%) rotate(-1deg); clip-path: inset(0); }
			100% { transform: none; clip-path: inset(0); }
		}

		.score-button {
			flex: none;
			width: 4.5rem;
			height: 4.5rem;
			border-radius: 50%;
			font-size: 2.5rem;
			font-weight: 700;
			line-height: 1;
		}

		.minus {
			grid-area: minus;
			background: transparent;
			border: 3px solid color-mix(in srgb, var(--team) 60%, var(--line));
			color: var(--fg);
		}

		.minus:hover {
			background: color-mix(in srgb, var(--team) 15%, transparent);
		}

		.minus[aria-disabled="true"] {
			opacity: 0.35;
			cursor: default;
		}

		.plus {
			grid-area: plus;
			background: var(--team);
			color: #111;
			box-shadow: 0 4px 16px color-mix(in srgb, var(--team) 45%, transparent);
		}

		.plus:hover {
			filter: brightness(1.1);
		}

		.welcome {
			max-width: 32rem;
			margin: 12vh auto 0;
			padding: 3rem 2rem;
			text-align: center;
			border-radius: var(--radius);
			background: var(--surface);
			border: 1px solid var(--line);
		}

		.welcome h2 {
			margin-top: 0;
			line-height: 1.3;
		}

		.panel {
			max-width: 40rem;
		}

		.manage-row {
			display: flex;
			align-items: center;
			gap: 1rem;
			padding: 1rem 1.25rem;
			margin-bottom: 0.75rem;
			border-radius: 1rem;
			background: var(--surface);
			border: 1px solid var(--line);
			border-left: 6px solid var(--team);
			font-size: 1.25rem;
		}

		.manage-row .team-name {
			flex: 1;
			font-weight: 700;
			overflow-wrap: anywhere;
		}

		.remove {
			padding: 0.5rem 1rem;
			border-radius: 999px;
			font-size: 1rem;
			font-weight: 600;
			background: transparent;
			border: 1px solid var(--line);
			color: var(--muted);
		}

		.remove:hover {
			color: var(--danger);
			border-color: var(--danger);
		}

		.empty {
			color: var(--muted);
			font-size: 1.125rem;
		}

		.form {
			padding: 1.5rem;
			border-radius: var(--radius);
			background: var(--surface);
			border: 1px solid var(--line);
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			margin-bottom: 1.25rem;
		}

		label {
			font-weight: 700;
		}

		input, select {
			padding: 0.875rem 1rem;
			font-size: 1.125rem;
			border-radius: 0.75rem;
			border: 1px solid var(--line);
			background: var(--bg);
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 0.75rem;
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
		}

		@media (max-width: 30rem) {
			header, main {
				padding-left: 1rem;
				padding-right: 1rem;
			}

			header {
				gap: 0.75rem;
			}

			header h1 {
				font-size: 4.2vw;
			}

			header .button {
				padding: 0.5rem 0.875rem;
				font-size: 0.875rem;
			}

			.score-button {
				width: 3.75rem;
				height: 3.75rem;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation: none !important;
				transition: none !important;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1>Halloween Score Tracker</h1>
		<button type="button" id="manage-button" class="button">Manage teams</button>
	</header>
	<main></main>
	<div id="status" class="visually-hidden" aria-live="polite"></div>
	<script>
		const COLORS = {
			Red: "#ff5c5c",
			Orange: "#ff9f43",
			Yellow: "#ffd93d",
			Green: "#4cd964",
			Teal: "#2dd4bf",
			Blue: "#5ab0ff",
			Purple: "#b78cff",
			Pink: "#ff7eb6",
		};
		const API_PATH = "/api/teams";
		const SOUNDS_API_PATH = "/api/sounds";
		const AUDIO_TYPES = {
			ogg: 'audio/ogg; codecs="vorbis"',
			mp3: "audio/mpeg",
			wav: "audio/wav",
			m4a: "audio/mp4",
			flac: "audio/flac",
		};

		const main = document.querySelector("main");
		const status = document.getElementById("status");
		const audio = new (window.AudioContext || window.webkitAudioContext)();
		const soundBuffers = { plus: [], minus: [] };
		let teams = [];
		let saveQueue = Promise.resolve();
		let playingSound = null;

		function el(tag, props = {}, ...children) {
			const node = document.createElement(tag);
			Object.assign(node, props);
			node.append(...children);
			return node;
		}

		function announce(message) {
			status.textContent = "";
			setTimeout(() => { status.textContent = message; }, 50);
		}

		function colorValue(color) {
			return COLORS[color] || color || "inherit";
		}

		function randomColor() {
			const used = new Set(teams.map(team => team.color));
			const unused = Object.keys(COLORS).filter(name => !used.has(name));
			const choices = unused.length ? unused : Object.keys(COLORS);
			return choices[Math.floor(Math.random() * choices.length)];
		}

		function playableFiles(files) {
			const probe = new Audio();
			const byName = new Map();
			for (const file of files) {
				const extension = file.split(".").pop().toLowerCase();
				if (!probe.canPlayType(AUDIO_TYPES[extension] || "")) continue;
				const name = file.slice(0, -extension.length - 1);
				if (!byName.has(name) || extension === "ogg") byName.set(name, file);
			}
			return [...byName.values()];
		}

		async function loadSounds() {
			if (navigator.audioSession) navigator.audioSession.type = "playback";
			const sounds = await fetch(SOUNDS_API_PATH).then(response => response.json()).catch(() => ({}));
			for (const side of Object.keys(soundBuffers)) {
				for (const file of playableFiles(sounds[side] || [])) {
					fetch(encodeURI(file))
						.then(response => response.arrayBuffer())
						.then(data => new Promise((resolve, reject) => audio.decodeAudioData(data, resolve, reject)))
						.then(buffer => { soundBuffers[side].push(buffer); })
						.catch(() => {});
				}
			}
		}

		function playSound(side) {
			if (audio.state === "suspended") audio.resume();
			const buffers = soundBuffers[side];
			if (!buffers.length) return;
			const buffer = buffers[Math.floor(Math.random() * buffers.length)];
			if (playingSound) playingSound.stop();
			playingSound = audio.createBufferSource();
			playingSound.buffer = buffer;
			playingSound.connect(audio.destination);
			playingSound.start();
		}

		function save() {
			const body = JSON.stringify(teams);
			saveQueue = saveQueue
				.then(() => fetch(API_PATH, { method: "PUT", headers: { "Content-Type": "application/json" }, body }))
				.then(response => {
					if (!response.ok) throw new Error(response.statusText);
				})
				.catch(() => announce("Could not save. Is the server running?"));
		}

		function show(...nodes) {
			main.replaceChildren(...nodes);
			main.querySelector("h2")?.focus();
		}

		function heading(text) {
			return el("h2", { textContent: text, tabIndex: -1 });
		}

		function showHome() {
			if (teams.length) showScoreboard();
			else showWelcome();
		}

		function showWelcome() {
			const button = el("button", { type: "button", className: "button button-primary", textContent: "Manage teams", onclick: showManage });
			show(el("div", { className: "welcome" }, heading("No teams yet. Add some to get started."), button));
		}

		function teamStyle(node, team) {
			node.style.setProperty("--team", colorValue(team.color));
			node.style.setProperty("--team-live", colorValue(team.color));
			return node;
		}

		function restartAnimation(node, className) {
			node.classList.remove(className);
			void node.offsetWidth;
			node.classList.add(className);
		}

		function changeScore(team, delta, scoreNode, minus) {
			const newScore = Math.max(0, team.score + delta);
			if (newScore === team.score) {
				announce(`${team.name}, ${team.score}`);
				return;
			}
			const card = scoreNode.closest(".score-card");
			const wasDead = team.score === 0;
			team.score = newScore;
			scoreNode.textContent = newScore;
			minus.ariaDisabled = String(newScore === 0);
			card.classList.toggle("dead", newScore === 0);
			restartAnimation(scoreNode, "bump");
			if (wasDead) restartAnimation(card, "rising");
			playSound(delta > 0 ? "plus" : "minus");
			let message = `${team.name}, ${newScore}`;
			if (newScore === 0) message += ", RIP";
			else if (wasDead) message += ", back from the dead";
			announce(message);
			save();
		}

		function showScoreboard() {
			const rows = teams.map(team => {
				const scoreNode = el("span", { className: "score", textContent: team.score });
				const minus = el("button", { type: "button", className: "score-button minus", textContent: "−", ariaLabel: `Decrease ${team.name}`, ariaDisabled: String(team.score === 0) });
				const plus = el("button", { type: "button", className: "score-button plus", textContent: "+", ariaLabel: `Increase ${team.name}` });
				minus.onclick = () => changeScore(team, -1, scoreNode, minus);
				plus.onclick = () => changeScore(team, 1, scoreNode, minus);
				const name = el("span", { className: "team-name", textContent: team.name });
				return teamStyle(el("li", { className: team.score === 0 ? "score-card dead" : "score-card" }, name, minus, scoreNode, plus), team);
			});
			const title = heading("Scores");
			title.className = "visually-hidden";
			show(title, el("ul", { className: "scoreboard" }, ...rows));
		}

		function removeTeam(team) {
			teams = teams.filter(other => other !== team);
			save();
			showManage();
			announce(`Removed ${team.name}`);
		}

		function showManage() {
			const rows = teams.map(team => {
				const name = el("span", { className: "team-name", textContent: team.name });
				const remove = el("button", { type: "button", className: "remove", textContent: "Remove", ariaLabel: `Remove ${team.name}`, onclick: () => removeTeam(team) });
				return teamStyle(el("li", { className: "manage-row" }, name, remove), team);
			});
			const list = rows.length ? el("ul", {}, ...rows) : el("p", { className: "empty", textContent: "No teams yet." });
			const actions = el("div", { className: "actions" },
				el("button", { type: "button", className: "button button-primary", textContent: "Add team", onclick: showAddTeam }),
				el("button", { type: "button", className: "button", textContent: "Done", onclick: showHome }),
			);
			show(el("div", { className: "panel" }, heading("Manage teams"), list, actions));
		}

		function showAddTeam() {
			const nameInput = el("input", { id: "team-name", type: "text", required: true, autocomplete: "off" });
			const colorSelect = el("select", { id: "team-color" },
				el("option", { value: "", textContent: "Random" }),
				...Object.keys(COLORS).map(color => el("option", { value: color, textContent: color })),
			);
			const form = el("form", { className: "form" },
				el("div", { className: "field" }, el("label", { htmlFor: "team-name", textContent: "Name" }), nameInput),
				el("div", { className: "field" }, el("label", { htmlFor: "team-color", textContent: "Color (optional)" }), colorSelect),
				el("div", { className: "actions" },
					el("button", { type: "submit", className: "button button-primary", textContent: "Add" }),
					el("button", { type: "button", className: "button", textContent: "Cancel", onclick: showManage }),
				),
			);
			form.onsubmit = event => {
				event.preventDefault();
				const name = nameInput.value.trim();
				if (!name) {
					nameInput.focus();
					return;
				}
				teams.push({ name, color: colorSelect.value || randomColor(), score: 0 });
				save();
				showManage();
				announce(`Added ${name}`);
			};
			show(el("div", { className: "panel" }, heading("Add team"), form));
			nameInput.focus();
		}

		async function load() {
			try {
				const response = await fetch(API_PATH);
				teams = await response.json();
			} catch {
				teams = [];
				announce("Could not load teams. Is the server running?");
			}
			showHome();
		}

		document.getElementById("manage-button").onclick = showManage;
		loadSounds();
		load();
	</script>
</body>
</html>
